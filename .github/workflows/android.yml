name: Android

# Builds the Android app: the Halide kernels, the codecs, the engine, then the Flutter editor.
# Nothing in here has run before — upstream CI builds macOS only and no Android package was ever
# published. The first green run is the milestone; treat later runs as routine.

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: 'apk (debug-signed, for a phone) or appbundle (Play)'
        type: choice
        options: [apk, appbundle]
        default: apk
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'flutter/**'
      - 'Sources/**'
      - 'tools/**'
      - 'Package.swift'
      - 'version.env'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.7'
  SWIFT_VERSION: '6.3.3'
  LLVM_MAJOR: '21'
  # The Swift SDK for Android is built against NDK LTS r30, so the codecs, the engine and Gradle all
  # use that one NDK rather than Flutter's default.
  NDK_RELEASE: 'r30'
  NDK_ZIP: 'https://dl.google.com/android/repository/android-ndk-r30-Linux.zip'
  SWIFT_SDK_URL: 'https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz'

jobs:
  # ---------------------------------------------------------------------------------------------
  # The Halide SDK: the pinned submodule with the Vulkan patches, against LLVM 21. Measured at
  # about six minutes cold on a stock runner (1978 build targets), so the cache buys little time
  # and mainly keeps the build honest about what changed.
  # ---------------------------------------------------------------------------------------------
  halide:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      pin: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # A repository created on Windows records no executable bit, so every .sh arrives as 644 and
      # running one directly is "Permission denied" (exit 126). The scripts call each other by path,
      # so the bit has to be real, not just applied to the ones this file names.
      - name: Make the scripts executable
        run: find . -name '*.sh' -exec chmod +x {} +

      - name: Pin
        id: pin
        run: echo "sha=$(git rev-parse HEAD:third_party/Halide)" >> "$GITHUB_OUTPUT"

      - name: Restore Halide
        id: cache
        uses: actions/cache@v4
        with:
          path: build/halide-linux-install
          key: halide-${{ steps.pin.outputs.sha }}-llvm${{ env.LLVM_MAJOR }}-${{ hashFiles('tools/halide-*.patch') }}

      - name: LLVM ${{ env.LLVM_MAJOR }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # The runner image carries a packages.microsoft.com source that answers 403, and a single
          # failing source aborts `apt-get update` with exit 100. Nothing here needs it.
          sudo rm -f /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget gnupg ca-certificates lsb-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          # The runner image carries a packages.microsoft.com source that answers 403, and a single
          # failing source aborts `apt-get update` with exit 100. Nothing here needs it.
          sudo rm -f /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update
          # libclang-*-dev carries the libclang*.a archives that ClangTargets.cmake names; without
          # it Halide's find_package(Clang) fails on a missing libclangBasic.a. polly is one of
          # their own link-time dependencies. liblld-*-dev is what answers Halide's WebAssembly
          # check, which reads LLD's CMake package rather than the lld binary.
          sudo apt-get install -y --no-install-recommends \
            llvm-${LLVM_MAJOR}-dev clang-${LLVM_MAJOR} lld-${LLVM_MAJOR} \
            libclang-${LLVM_MAJOR}-dev libpolly-${LLVM_MAJOR}-dev liblld-${LLVM_MAJOR}-dev \
            libvulkan-dev ninja-build cmake libxml2-dev libffi-dev zlib1g-dev \
            libdigest-sha-perl rsync

      - name: Halide
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          LLVM_ROOT: /usr/lib/llvm-${{ env.LLVM_MAJOR }}
        run: |
          # The script copies the pin out of the submodule, so the submodule has to be here.
          git submodule update --init --depth 1 third_party/Halide
          export PATH="/usr/lib/llvm-${LLVM_MAJOR}/bin:$PATH"
          tools/build-halide-linux.sh

      # The install travels to the `android` job through the cache, not an artifact. Artifacts count
      # against the plan's storage quota — 500 MB on GitHub Free — and this install alone is most of
      # it. The cache has its own 10 GB per repository and does not touch that quota.

  # ---------------------------------------------------------------------------------------------
  # The still codecs and FFmpeg, cross-compiled for arm64-v8a. The script pins its own versions and
  # downloads its own sources, so this only rebuilds when the script or the NDK changes.
  # ---------------------------------------------------------------------------------------------
  codecs:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Make the scripts executable
        run: find . -name '*.sh' -exec chmod +x {} +

      - name: Restore codecs
        id: cache
        uses: actions/cache@v4
        with:
          path: build/android-deps
          key: codecs-${{ env.NDK_RELEASE }}-${{ hashFiles('tools/build-android-codecs.sh') }}

      - name: NDK ${{ env.NDK_RELEASE }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # The runner image carries a packages.microsoft.com source that answers 403, and a single
          # failing source aborts `apt-get update` with exit 100. Nothing here needs it.
          sudo rm -f /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config autoconf automake libtool nasm yasm \
            wget unzip rsync python3
          curl -fSL -o /tmp/ndk.zip "$NDK_ZIP"
          unzip -qo /tmp/ndk.zip -d /tmp
          NDK_REV="$(sed -n 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*//p' /tmp/android-ndk-${NDK_RELEASE}/source.properties)"
          echo "NDK revision $NDK_REV"
          sudo mkdir -p "$ANDROID_HOME/ndk/$NDK_REV"
          sudo cp -a /tmp/android-ndk-${NDK_RELEASE}/. "$ANDROID_HOME/ndk/$NDK_REV/"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_REV" >> "$GITHUB_ENV"
          echo "FOTUFILM_ANDROID_NDK_VERSION=$NDK_REV" >> "$GITHUB_ENV"

      - name: Codecs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          test -d "$ANDROID_NDK_HOME" || { echo "NDK missing at $ANDROID_NDK_HOME"; exit 1; }
          tools/build-android-codecs.sh

      # Also handed over by cache rather than artifact, for the same reason as the Halide install.

  # ---------------------------------------------------------------------------------------------
  # The engine and the app. JDK 17, the Android SDK, Flutter, and a swift.org toolchain with its
  # Android SDK — the SDK version must match the toolchain exactly, and Xcode's Swift cannot read
  # it. LLVM stays installed because the AOT generator loads libHalide.so, which links libLLVM.
  # ---------------------------------------------------------------------------------------------
  android:
    needs: [halide, codecs]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Make the scripts executable
        run: find . -name '*.sh' -exec chmod +x {} +

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Toolchain
        run: |
          # The runner image carries a packages.microsoft.com source that answers 403, and a single
          # failing source aborts `apt-get update` with exit 100. Nothing here needs it.
          sudo rm -f /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget gnupg ca-certificates lsb-release cmake ninja-build rsync python3 libdigest-sha-perl
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          # The runner image carries a packages.microsoft.com source that answers 403, and a single
          # failing source aborts `apt-get update` with exit 100. Nothing here needs it.
          sudo rm -f /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-${LLVM_MAJOR} clang-${LLVM_MAJOR}

      - name: NDK ${{ env.NDK_RELEASE }}
        run: |
          curl -fSL -o /tmp/ndk.zip "$NDK_ZIP"
          unzip -qo /tmp/ndk.zip -d /tmp
          NDK_REV="$(sed -n 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*//p' /tmp/android-ndk-${NDK_RELEASE}/source.properties)"
          echo "NDK revision $NDK_REV"
          sudo mkdir -p "$ANDROID_HOME/ndk/$NDK_REV"
          sudo cp -a /tmp/android-ndk-${NDK_RELEASE}/. "$ANDROID_HOME/ndk/$NDK_REV/"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_REV" >> "$GITHUB_ENV"
          echo "FOTUFILM_ANDROID_NDK_VERSION=$NDK_REV" >> "$GITHUB_ENV"

      - name: Restore Halide
        uses: actions/cache/restore@v4
        with:
          path: build/halide-linux-install
          key: halide-${{ needs.halide.outputs.pin }}-llvm${{ env.LLVM_MAJOR }}-${{ hashFiles('tools/halide-*.patch') }}
          fail-on-cache-miss: true

      - name: Restore codecs
        uses: actions/cache/restore@v4
        with:
          path: build/android-deps
          key: codecs-${{ env.NDK_RELEASE }}-${{ hashFiles('tools/build-android-codecs.sh') }}
          fail-on-cache-miss: true

      - name: Swift ${{ env.SWIFT_VERSION }}
        run: |
          set -euo pipefail
          URL="https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz"
          echo "Swift toolchain: $URL"
          curl -fSL "$URL" -o /tmp/swift.tar.gz
          sudo mkdir -p /opt/swift
          sudo tar -xzf /tmp/swift.tar.gz -C /opt/swift --strip-components=1
          /opt/swift/usr/bin/swift --version
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"

      - name: Swift SDK for Android
        run: |
          set -euo pipefail
          # `swift sdk install <url>` demands --checksum, and swift.org publishes a checksum per
          # release rather than a stable URL for it. Installing from a local bundle sidesteps that
          # without pinning a hash that moves with every release. The bundle carries its own name,
          # so it lands at ~/.swiftpm/swift-sdks/swift-<version>-RELEASE_android.artifactbundle —
          # which is exactly what tools/build-android-engine.sh looks for.
          curl -fSL "$SWIFT_SDK_URL" -o /tmp/android-sdk.tar.gz
          ls -l /tmp/android-sdk.tar.gz
          mkdir -p /tmp/swiftsdk
          tar -xzf /tmp/android-sdk.tar.gz -C /tmp/swiftsdk
          BUNDLE="$(find /tmp/swiftsdk -maxdepth 2 -name '*.artifactbundle' | head -1)"
          test -n "$BUNDLE" || { echo "no .artifactbundle in the tarball"; find /tmp/swiftsdk -maxdepth 2; exit 1; }
          echo "Bundle: $BUNDLE"
          swift sdk install "$BUNDLE"
          swift sdk list
          swift sdk list | grep -qx "swift-${SWIFT_VERSION}-RELEASE_android" \
            || { echo "SDK installed under another name; the engine script will not find it"; exit 1; }
          # tools/build-android-engine.sh hardcodes <bundle>/swift-android as the directory holding
          # swift-resources/ and ndk-sysroot. The published bundle does not necessarily name its
          # platform directory that, and the script has no fallback, so point the expected name at
          # whatever is actually there.
          # tools/build-android-engine.sh resolves the SDK at a fixed path under
          # ~/.swiftpm/swift-sdks and has no fallback, but `swift sdk install` in this toolchain
          # puts it somewhere else. Locate the bundle, then make the expected path reach it, and
          # give it the swift-android directory name the script also assumes.
          SDKNAME="swift-${SWIFT_VERSION}-RELEASE_android.artifactbundle"
          EXPECTED="$HOME/.swiftpm/swift-sdks/$SDKNAME"
          if [ ! -d "$EXPECTED" ]; then
            echo "not at $EXPECTED; looking for the bundle:"
            ACTUAL="$(find "$HOME" /opt /usr/local /usr/lib -maxdepth 8 -type d -name "$SDKNAME" 2>/dev/null | head -1)"
            if [ -z "$ACTUAL" ]; then
              echo "no directory named $SDKNAME; any artifactbundle under HOME:"
              find "$HOME" -maxdepth 8 -type d -name '*.artifactbundle' 2>/dev/null | head -10
              ACTUAL="$(find "$HOME" -maxdepth 8 -type d -name '*.artifactbundle' 2>/dev/null | head -1)"
            fi
            test -n "$ACTUAL" || { echo "the bundle is nowhere findable"; exit 1; }
            echo "found at: $ACTUAL"
            mkdir -p "$HOME/.swiftpm/swift-sdks"
            ln -sfn "$ACTUAL" "$EXPECTED"
          fi
          SDKROOT="$EXPECTED"
          echo "Bundle root: $SDKROOT"
          ls -la "$SDKROOT"
          if [ ! -d "$SDKROOT/swift-android" ]; then
            # The platform directory is whichever one carries swift-resources/ and the NDK setup
            # script; its published name is not the one the engine script expects.
            INNER="$(find "$SDKROOT/" -maxdepth 3 -name 'setup-android-sdk.sh' -printf '%h\n' 2>/dev/null | head -1)"
            if [ -z "$INNER" ]; then
              INNER="$(find "$SDKROOT/" -maxdepth 3 -type d -name 'swift-resources' -printf '%h\n' 2>/dev/null | head -1)"
            fi
            if [ -z "$INNER" ]; then
              echo "cannot identify the platform directory; bundle contents:"
              find "$SDKROOT/" -maxdepth 2 | head -40
              exit 1
            fi
            echo "Linking $INNER -> $SDKROOT/swift-android"
            ln -sfn "$INNER" "$SDKROOT/swift-android"
          fi
          ls -la "$SDKROOT/swift-android" | head -20

      - name: Engine and app
        env:
          HALIDE_ROOT: ${{ github.workspace }}/build/halide-linux-install
          FOTUFILM_ANDROID_DEPS: ${{ github.workspace }}/build/android-deps
          SWIFT_TOOLCHAIN: /opt/swift
          SWIFT_SDK: swift-${{ env.SWIFT_VERSION }}-RELEASE_android
          LD_LIBRARY_PATH: /usr/lib/llvm-21/lib
          # generate-halide-aot-android.sh compiles its generator with ${CXX:-clang++}. The
          # apt.llvm.org clang++ drives lld without the distribution's default library paths, so
          # even -lpthread fails to resolve. Halide itself was built by the host GCC, so g++ is
          # also the ABI-consistent choice for linking against libHalide.so.
          CXX: g++
        run: |
          set -euo pipefail
          test -d "$ANDROID_NDK_HOME" || { echo "NDK missing"; exit 1; }
          test -f "$HALIDE_ROOT/include/Halide.h" || { echo "Halide missing"; exit 1; }
          test -f "$FOTUFILM_ANDROID_DEPS/arm64/lib/libjpeg.a" || { echo "codecs missing"; exit 1; }
          flutter config --no-analytics
          if [[ "${{ inputs.artifact || 'apk' }}" == "appbundle" ]]; then
            flutter/build-android.sh --appbundle
          else
            flutter/build-android.sh
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fotufilm-android
          path: |
            build/flutter-host/*.apk
            build/flutter-host/*.aab
          retention-days: 30
          if-no-files-found: error
